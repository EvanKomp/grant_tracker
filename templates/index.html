<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grant Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Grant Tracker</h1>
    <nav>
      <button id="nav-board" class="nav-btn">Board</button>
      <button id="nav-timeline" class="nav-btn">Timeline</button>
      <button id="nav-list" class="nav-btn">List</button>
    </nav>
    <button id="new-project-btn" class="primary-btn">+ New project</button>
    <button id="quit-btn" class="ghost-btn" title="Stop Grant Tracker on this computer">Quit</button>
  </header>

  <main>
    <section id="board-view">
      <div id="columns"></div>
    </section>

    <section id="timeline-view" hidden>
      <div class="timeline-nav">
        <span class="tl-nav-side"></span>
        <span class="tl-week-nav">
          <button id="week-prev" class="soft-btn">&larr; Previous week</button>
          <span id="week-label"></span>
          <button id="week-next" class="soft-btn">Next week &rarr;</button>
        </span>
        <span class="tl-nav-side right">
          <button id="session-add" class="soft-btn">+ Add session</button>
          <button id="hours-export" class="soft-btn">Export hours</button>
        </span>
      </div>
      <div id="timeline-grid"></div>
    </section>

    <section id="list-view" hidden>
      <div class="list-controls">
        <label class="list-project-label">Project
          <select id="list-project"></select>
        </label>
        <span class="list-export">
          <label for="export-since">Export grants submitted since</label>
          <input type="date" id="export-since">
          <button id="export-pdf" class="soft-btn">Export PDF</button>
        </span>
      </div>
      <div id="list-table"></div>
    </section>
  </main>

  <dialog id="modal">
    <div id="modal-content"></div>
  </dialog>

  <div id="toast" hidden></div>

  <script src="/static/board.js" defer></script>
  <script src="/static/timeline.js" defer></script>
  <script src="/static/list.js" defer></script>
</body>
</html>
